name: Build SwarSanket Android APK & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
          validate-wrappers: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Assets (Vite)
        run: pnpm run build

      - name: Sync Capacitor Android
        run: |
          pnpm exec cap sync android

      - name: Regenerate Gradle Wrapper & Build APK
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.14.3 --distribution-type all
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare SwarSanket.apk artifact
        run: |
          mkdir -p release-output
          # Locate built debug apk and copy as SwarSanket.apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/SwarSanket.apk \;
          ls -la release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwarSanket-Android-APK
          path: release-output/SwarSanket.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          name: "SwarSanket Mobile Release ${{ github.ref_name }}"
          body: |
            ## SwarSanket — Voice-First AI Alzheimer's Early Screening

            ### 📱 Android APK Direct Download
            Direct APK download for Android phones:
            - **[Download SwarSanket.apk](https://github.com/Diptish-De/SIH-26/releases/latest/download/SwarSanket.apk)**

            ### 🚀 Highlights
            - Early voice biomarker screening for elderly users across 9 Indian languages.
            - Dual-engine classical (Xception + XGBoost) and Quantum-hybrid (PennyLane) model analysis.
            - Full offline capability with local IndexedDB queuing and auto-sync.
            - Doctor clinical dashboard, longitudinal acoustic trend charts, and downloadable medical report.
          files: release-output/SwarSanket.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
